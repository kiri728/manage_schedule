<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>スケジュール管理</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>スケジュール</h1>

        <input type="text" id="search" placeholder="名前検索"></input>
        
        <div id="main-page">
            <div class="button-area" style="display:block;">
                <button id="input_button" onclick="openForm();">+</button>
            </div>

            <div class="table-area" style="display:block;">
                <table id="schedule">
                    <thead>
                        <tr>
                            <th>課題</th>
                            <th>締切日</th>
                            <th>終了時間</th>
                            <!--<th>メモ</th>--><!--今後実装-->
                            <th>色</th>
                        </tr>
                    </thead>
                    <tbody id="schedule-body">
                    </tbody>
                </table>
            </div>
        </div>

        <div id="overlay" onclick="closeForm()"></div>

        <div id="form-popup" style="display:none;">

            <button id="close-button" onclick="closeForm()">×</button>

            <h2>予定追加</h2>

            <div id="input-area">
                <label for="title">タイトル</label>
                <input type="text" id="title">
                <label for="date">日程</label>
                <input type="date" id="date">
                <label for="end">終了時間</label>
                <input type="time" id="end">
                <label for="color">ラベル</label>
                <input type="color" id="color">
            </div>

            <br><br>

            <button id="add-button" onclick="addschedule();closeForm();">追加</button>

        </div>
        <script src="script.js"></script>
    </body>
</html>
